<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radioguess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f0d;
  --panel:#121712;
  --panel-2:#161c16;
  --line:#263028;
  --text:#e7e4da;
  --muted:#8b9c8d;
  --teal:#3fae9c;
  --amber:#e3b23c;
  --wrong:#c1443f;
  --right:#6fbf73;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100%;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(63,174,156,0.08), transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(227,178,60,0.06), transparent 50%);
}
.wrap{
  max-width:560px;
  margin:0 auto;
  padding:48px 20px 64px;
  min-height:100%;
}
header.top{text-align:center;margin-bottom:34px;}
.glitch-title{
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:clamp(2rem, 8vw, 2.6rem);
  letter-spacing:0.02em;
  margin:0;
  color:var(--text);
  text-shadow: 2px 0 var(--teal), -2px 0 var(--wrong);
  line-height:1.05;
}
.subtitle{color:var(--muted);font-size:0.92rem;margin-top:10px;letter-spacing:0.01em;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:28px;}

/* Home screen */
.diff-list{display:flex;flex-direction:column;gap:12px;}
.diff-btn{
  text-align:left;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:3px;
  padding:16px 18px;
  cursor:pointer;
  font-family:inherit;
  transition:border-color .15s ease, transform .1s ease;
}
.diff-btn:hover{border-color:var(--teal);}
.diff-btn:active{transform:scale(0.99);}
.diff-btn .name{
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:1rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.diff-btn .desc{color:var(--muted);font-size:0.85rem;margin-top:6px;line-height:1.4;}
.pool-count{color:var(--muted);font-size:0.78rem;font-weight:400;font-family:'Inter',sans-serif;}

/* Game screen */
.progress-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;font-family:'Space Mono',monospace;font-size:0.82rem;color:var(--muted);
}
.score{color:var(--amber);}
.bar-track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:26px;}
.bar-fill{height:100%;background:var(--teal);transition:width .3s ease;}
.player{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 10px 30px;}
.play-btn{
  width:78px;height:78px;border-radius:50%;background:var(--teal);border:none;color:#06110d;
  font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease, background .15s ease;flex-shrink:0;
}
.play-btn:hover{transform:scale(1.05);}
.play-btn:disabled{opacity:0.4;cursor:default;transform:none;}
.play-btn.playing{background:var(--amber);}
.bars{display:flex;align-items:flex-end;gap:3px;height:32px;}
.bars span{width:4px;background:var(--teal);border-radius:2px;height:20%;transition:height .1s ease;}
.guesses-row{display:flex;gap:8px;justify-content:center;margin-top:2px;}
.guess-dot{width:10px;height:10px;border-radius:50%;background:var(--line);border:1px solid var(--muted);}
.guess-dot.used-wrong{background:var(--wrong);border-color:var(--wrong);}
.guess-form{display:flex;gap:8px;margin-top:22px;}
.guess-form input{
  flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  padding:12px 14px;border-radius:3px;font-family:'Inter',sans-serif;font-size:0.95rem;
}
.guess-form input:focus{outline:none;border-color:var(--teal);}
.guess-form button{
  background:var(--text);color:var(--bg);border:none;padding:0 20px;border-radius:3px;
  font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
}
.guess-form button:disabled{opacity:0.4;cursor:default;}
.feedback{margin-top:16px;min-height:24px;font-size:0.9rem;text-align:center;font-family:'Space Mono',monospace;}
.feedback.wrong{color:var(--wrong);}
.feedback.right{color:var(--right);}
.feedback.reveal{color:var(--muted);}
.next-btn{
  display:block;margin:18px auto 0;background:var(--teal);color:#06110d;border:none;
  padding:11px 26px;border-radius:3px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
}
.audio-missing{margin-top:14px;font-size:0.76rem;color:var(--amber);text-align:center;line-height:1.5;}
.reveal-card{
  display:flex;align-items:center;gap:14px;margin-top:16px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;
}
.reveal-cover{
  width:56px;height:56px;border-radius:3px;flex-shrink:0;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.reveal-cover img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.reveal-cover img.hidden{display:none;}
#reveal-cover-fallback{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;font-weight:700;font-size:1.1rem;color:#06110d;
}
.reveal-title{font-weight:600;font-size:0.95rem;}
.reveal-album{color:var(--muted);font-size:0.8rem;margin-top:2px;}

/* Results */
.results h2{font-family:'Space Mono',monospace;font-size:2.4rem;text-align:center;margin:0 0 4px;}
.results .score-label{text-align:center;color:var(--muted);margin-bottom:24px;font-size:0.85rem;}
.round-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
.round-list li{
  display:flex;justify-content:space-between;gap:10px;padding:10px 12px;
  background:var(--panel-2);border-radius:3px;border-left:3px solid var(--line);font-size:0.88rem;
}
.round-list li.correct{border-left-color:var(--right);}
.round-list li.incorrect{border-left-color:var(--wrong);}
.round-list .title{font-weight:500;}
.round-list .album{color:var(--muted);font-size:0.78rem;}
.again-row{display:flex;gap:10px;margin-top:24px;}
.again-row button{
  flex:1;padding:13px;border-radius:3px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--text);font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
}
.again-row button.primary{background:var(--teal);color:#06110d;border-color:var(--teal);}
.hidden{display:none !important;}
.back-link{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-family:'Space Mono',monospace;font-size:0.78rem;margin-bottom:14px;padding:0;
}
.back-link:hover{color:var(--text);}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="glitch-title">RADIOGUESS</h1>
    <p class="subtitle">a Radiohead song-guessing game</p>
  </header>

  <section id="screen-home" class="card">
    <div id="diff-list" class="diff-list"></div>
  </section>

  <section id="screen-game" class="card hidden">
    <button class="back-link" id="quit-btn">&larr; quit round</button>
    <div class="progress-row">
      <span id="progress-label">Song 1/10</span>
      <span class="score">Score: <span id="score-label">0</span></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:10%"></div></div>

    <div class="player">
      <button class="play-btn" id="play-btn">&#9654;</button>
      <div class="bars" id="bars"></div>
      <div class="guesses-row" id="guesses-row"></div>
    </div>

    <form class="guess-form" id="guess-form" autocomplete="off">
      <input type="text" id="guess-input" placeholder="Song title…" list="song-datalist" autocomplete="off">
      <datalist id="song-datalist"></datalist>
      <button type="submit" id="guess-submit">Guess</button>
    </form>
    <div class="feedback" id="feedback"></div>
    <div class="reveal-card hidden" id="reveal-card">
      <div class="reveal-cover" id="reveal-cover">
        <img id="reveal-cover-img" alt="">
        <span id="reveal-cover-fallback"></span>
      </div>
      <div class="reveal-info">
        <div class="reveal-title" id="reveal-title"></div>
        <div class="reveal-album" id="reveal-album"></div>
      </div>
    </div>
    <button class="next-btn hidden" id="next-btn">Next song &rarr;</button>
    <div class="audio-missing hidden" id="audio-missing"></div>
  </section>

  <section id="screen-results" class="card results hidden">
    <h2 id="final-score">0/10</h2>
    <p class="score-label" id="final-diff">easy round</p>
    <ul class="round-list" id="round-list"></ul>
    <div class="again-row">
      <button id="replay-btn" class="primary">Play again</button>
      <button id="home-btn">Change difficulty</button>
    </div>
  </section>
</div>

<audio id="audio-el" preload="none"></audio>

  hard:   {label:"Hard",   desc:"Every studio album, deep cuts included."},
};
const ROUND_LENGTH = 10;
const MAX_GUESSES = 3;
const CLIP_SECONDS = 5;

let state = null;
const el = id => document.getElementById(id);
const audioEl = el('audio-el');

function normalize(s){
  return s.toLowerCase().replace(/["'’*().,]/g,'').replace(/\s+/g,' ').trim();
}

function buildHome(){
  const list = el('diff-list');
  list.innerHTML = '';
  Object.keys(DIFF_META).forEach(key => {
    const meta = DIFF_META[key];
    const btn = document.createElement('button');
    btn.className = 'diff-btn';
    btn.innerHTML = `<div class="name">${meta.label} <span class="pool-count">${SONGS[key].length} songs in pool</span></div>
                      <div class="desc">${meta.desc}</div>`;
    btn.onclick = () => startRound(key);
    list.appendChild(btn);
  });
}

function pickRound(diffKey){
  const pool = SONGS[diffKey].slice();
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  return pool.slice(0, Math.min(ROUND_LENGTH, pool.length));
}

function startRound(diffKey){
  state = {
    diff: diffKey,
    round: pickRound(diffKey),
    index: 0,
    score: 0,
    guessesUsed: 0,
    finished: [],
    solved: false,
  };
  showScreen('game');
  buildDatalist(diffKey);
  loadSong();
}

function buildDatalist(diffKey){
  const dl = el('song-datalist');
  dl.innerHTML = '';
  SONGS[diffKey].forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.title;
    dl.appendChild(opt);
  });
}

function showScreen(name){
  ['home','game','results'].forEach(s => {
    el('screen-'+s).classList.toggle('hidden', s !== name);
  });
}

function currentSong(){ return state.round[state.index]; }

function loadSong(){
  state.guessesUsed = 0;
  state.solved = false;
  const song = currentSong();

  el('progress-label').textContent = `Song ${state.index+1}/${state.round.length}`;
  el('score-label').textContent = state.score;
  el('bar-fill').style.width = `${((state.index)/state.round.length)*100}%`;

  el('guess-input').value = '';
  el('guess-input').disabled = false;
  el('guess-submit').disabled = false;
  el('feedback').textContent = '';
  el('feedback').className = 'feedback';
  el('next-btn').classList.add('hidden');
  el('audio-missing').classList.add('hidden');
  el('reveal-card').classList.add('hidden');
  el('play-btn').disabled = false;
  el('play-btn').classList.remove('playing');
  el('play-btn').innerHTML = '&#9654;';
  state.revealed = false;
  clearTimeout(clipTimeout);

  renderGuessDots();
  buildBars();

  audioEl.pause();
  audioEl.currentTime = 0;
  audioEl.src = `audio/${song.file}`;

  el('guess-input').focus();
}

function buildBars(){
  const bars = el('bars');
  bars.innerHTML = '';
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    bars.appendChild(s);
  }
}

function animateBars(on){
  const spans = el('bars').querySelectorAll('span');
  if(!on){ spans.forEach(s=>s.style.height='20%'); return; }
  spans.forEach(s => { s.style.height = (15 + Math.random()*85) + '%'; });
}

let barsInterval = null;
let clipTimeout = null;

function hashColor(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
  const hue = Math.abs(h) % 360;
  return `hsl(${hue}, 55%, 45%)`;
}

function slugify(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

// Filenames expected in a "covers" folder next to this file, e.g. covers/ok-computer.jpg
// Edit these if you name your image files differently.
const ALBUM_COVERS = {
  "Pablo Honey": "pablo-honey.jpg",
  "The Bends": "the-bends.jpg",
  "OK Computer": "ok-computer.jpg",
  "Kid A": "kid-a.jpg",
  "Amnesiac": "amnesiac.jpg",
  "Hail to the Thief": "hail-to-the-thief.jpg",
  "In Rainbows": "in-rainbows.jpg",
  "The King of Limbs": "the-king-of-limbs.jpg",
  "A Moon Shaped Pool": "a-moon-shaped-pool.jpg",
};

function showReveal(song){
  el('reveal-title').textContent = song.title;
  el('reveal-album').textContent = song.album;

  const fallback = el('reveal-cover-fallback');
  fallback.style.background = hashColor(song.album);
  fallback.textContent = song.album.split(' ').filter(w=>/[a-zA-Z0-9]/.test(w[0])).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  fallback.classList.remove('hidden');

  const img = el('reveal-cover-img');
  img.classList.add('hidden');
  const filename = ALBUM_COVERS[song.album] || `${slugify(song.album)}.jpg`;
  img.onload = () => { fallback.classList.add('hidden'); img.classList.remove('hidden'); };
  img.onerror = () => { img.classList.add('hidden'); fallback.classList.remove('hidden'); };
  img.src = `covers/${filename}`;

  el('reveal-card').classList.remove('hidden');
}

function playFull(fromStart){
  if(fromStart) audioEl.currentTime = 0;
  const p = audioEl.play();
  if(p){
    p.catch(() => {
      el('audio-missing').textContent = `Couldn't play audio/${currentSong().file}`;
      el('audio-missing').classList.remove('hidden');
    });
  }
}

audioEl.addEventListener('play', () => {
  el('play-btn').classList.add('playing');
  el('play-btn').innerHTML = '&#10074;&#10074;';
  clearInterval(barsInterval);
  barsInterval = setInterval(() => animateBars(true), 90);
});
audioEl.addEventListener('pause', () => {
  el('play-btn').classList.remove('playing');
  el('play-btn').innerHTML = '&#9654;';
  clearInterval(barsInterval);
  animateBars(false);
});
audioEl.addEventListener('ended', () => {
  el('play-btn').classList.remove('playing');
  el('play-btn').innerHTML = '&#9654;';
  clearInterval(barsInterval);
  animateBars(false);
});
audioEl.addEventListener('error', () => {
  el('audio-missing').textContent = `Missing audio file: audio/${currentSong().file}`;
  el('audio-missing').classList.remove('hidden');
});

el('play-btn').addEventListener('click', () => {
  if(el('play-btn').disabled) return;
  if(audioEl.paused){
    playFull(true);
    clearTimeout(clipTimeout);
    if(!state.revealed){
      clipTimeout = setTimeout(() => audioEl.pause(), CLIP_SECONDS*1000);
    }
  } else {
    audioEl.pause();
  }
});

function renderGuessDots(){
  const row = el('guesses-row');
  row.innerHTML = '';
  for(let i=0;i<MAX_GUESSES;i++){
    const d = document.createElement('div');
    d.className = 'guess-dot' + (i < state.guessesUsed ? ' used-wrong' : '');
    row.appendChild(d);
  }
}

el('guess-form').addEventListener('submit', (e) => {
  e.preventDefault();
  if(state.solved) return;
  const raw = el('guess-input').value.trim();
  if(!raw) return;
  const song = currentSong();
  const correct = normalize(raw) === normalize(song.title);

  if(correct){
    state.solved = true;
    state.score += 1;
    el('feedback').textContent = `Correct — "${song.title}" (${song.album})`;
    el('feedback').className = 'feedback right';
    finishSong(true);
  } else {
    state.guessesUsed += 1;
    renderGuessDots();
    if(state.guessesUsed >= MAX_GUESSES){
      el('feedback').textContent = `Out of guesses — it was "${song.title}" (${song.album})`;
      el('feedback').className = 'feedback reveal';
      finishSong(false);
    } else {
      const left = MAX_GUESSES - state.guessesUsed;
      el('feedback').textContent = `Not quite — ${left} guess${left===1?'':'es'} left`;
      el('feedback').className = 'feedback wrong';
      el('guess-input').value = '';
      el('guess-input').focus();
    }
  }
});

function finishSong(wasCorrect){
  state.revealed = true;
  clearTimeout(clipTimeout);
  el('guess-input').disabled = true;
  el('guess-submit').disabled = true;
  state.finished.push({title: currentSong().title, album: currentSong().album, correct: wasCorrect});
  showReveal(currentSong());
  el('next-btn').classList.remove('hidden');
  el('next-btn').textContent = (state.index === state.round.length-1) ? 'See results →' : 'Next song →';
  playFull(true);
}

el('next-btn').addEventListener('click', () => {
  audioEl.pause();
  state.index += 1;
  if(state.index >= state.round.length){
    showResults();
  } else {
    loadSong();
  }
});

el('quit-btn').addEventListener('click', () => {
  audioEl.pause();
  clearInterval(barsInterval);
  showScreen('home');
});

function showResults(){
  el('bar-fill').style.width = '100%';
  showScreen('results');
  el('final-score').textContent = `${state.score}/${state.round.length}`;
  el('final-diff').textContent = `${DIFF_META[state.diff].label} round`;
  const ul = el('round-list');
  ul.innerHTML = '';
  state.finished.forEach(f => {
    const li = document.createElement('li');
    li.className = f.correct ? 'correct' : 'incorrect';
    li.innerHTML = `<span class="title">${f.title}</span><span class="album">${f.album}</span>`;
    ul.appendChild(li);
  });
}

el('replay-btn').addEventListener('click', () => startRound(state.diff));
el('home-btn').addEventListener('click', () => showScreen('home'));

buildHome();
</script>
</body>
</html>
